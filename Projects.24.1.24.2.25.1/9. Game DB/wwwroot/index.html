<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сапёр — DB</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #172033;
            color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px;
        }
        .app {
            width: fit-content;
            max-width: 100%;
            background: #111827;
            border: 2px solid #374151;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        h1, h2 { text-align: center; }
        h1 { margin: 0 0 14px; }
        h2 { margin: 18px 0 8px; font-size: 20px; }
        .panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        input, select, button {
            border: 0;
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 15px;
        }
        input, select { background: #f9fafb; color: #111827; }
        button { background: #2563eb; color: white; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
            color: #d1d5db;
        }
        .badge {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 999px;
            padding: 7px 12px;
        }
        #board {
            display: grid;
            gap: 2px;
            background: #374151;
            border: 4px solid #374151;
            border-radius: 8px;
            margin: 0 auto;
            max-width: 95vw;
            overflow: auto;
        }
        .cell {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 4px;
            background: #9ca3af;
            color: #111827;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover { filter: brightness(1.08); }
        .revealed { background: #e5e7eb; cursor: default; }
        .flagged { background: #fbbf24; }
        .mine { background: #ef4444; color: white; }
        .status {
            margin-top: 14px;
            text-align: center;
            min-height: 24px;
            font-size: 18px;
            font-weight: bold;
        }
        .hint {
            margin-top: 10px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            background: #1f2937;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            border-bottom: 1px solid #374151;
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }
        th { background: #374151; }
        tr:last-child td { border-bottom: 0; }
    </style>
</head>
<body>
    <main class="app">
        <h1>Сапёр — DB</h1>

        <div class="panel">
            <label>Имя: <input id="playerNameInput" value="Игрок" maxlength="40" /></label>
            <label>
                Сложность:
                <select id="difficultySelect">
                    <option value="easy">Лёгкий — 9×9, 10 мин</option>
                    <option value="medium">Средний — 12×12, 25 мин</option>
                    <option value="hard">Тяжёлый — 16×16, 50 мин</option>
                </select>
            </label>
            <label>
                Первый ход:
                <select id="firstMoveSelect">
                    <option value="safe">Безопасный</option>
                    <option value="dangerous">Опасный</option>
                </select>
            </label>
            <button id="newGameButton">Новая игра</button>
        </div>

        <div class="info">
            <span class="badge" id="mineCounter">Мины: 0</span>
            <span class="badge" id="flagCounter">Флаги: 0</span>
            <span class="badge" id="moveCounter">Ходы: 0</span>
            <span class="badge" id="timer">Время: 0 сек.</span>
        </div>

        <div id="board"></div>
        <div class="status" id="status">Выберите клетку</div>
        <div class="hint">ЛКМ — открыть клетку. ПКМ — поставить или убрать флажок. Игровая логика выполняется на сервере. Результат сохраняется в SQLite после окончания игры.</div>

        <h2>Таблица результатов</h2>
        <table>
            <thead>
                <tr>
                    <th>Игрок</th>
                    <th>Итог</th>
                    <th>Сложность</th>
                    <th>Первый ход</th>
                    <th>Время</th>
                    <th>Ходы</th>
                    <th>Дата</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                <tr><td colspan="7">Загрузка...</td></tr>
            </tbody>
        </table>
    </main>

    <script>
        const difficultySelect = document.getElementById('difficultySelect');
        const firstMoveSelect = document.getElementById('firstMoveSelect');
        const playerNameInput = document.getElementById('playerNameInput');
        const newGameButton = document.getElementById('newGameButton');
        const board = document.getElementById('board');
        const statusText = document.getElementById('status');
        const mineCounter = document.getElementById('mineCounter');
        const flagCounter = document.getElementById('flagCounter');
        const moveCounter = document.getElementById('moveCounter');
        const timerText = document.getElementById('timer');
        const resultsBody = document.getElementById('resultsBody');
        let game = null;
        let busy = false;
        let shownSeconds = 0;
        let tick = null;

        async function request(url, method = 'GET', body = null) {
            const options = { method };
            if (body !== null) {
                options.headers = { 'Content-Type': 'application/json' };
                options.body = JSON.stringify(body);
            }
            const response = await fetch(url, options);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
        }

        async function newGame() {
            if (busy) return;
            busy = true;
            newGameButton.disabled = true;
            try {
                game = await request('/api/games', 'POST', {
                    playerName: playerNameInput.value || 'Игрок',
                    difficulty: difficultySelect.value,
                    safeFirstMove: firstMoveSelect.value === 'safe'
                });
                shownSeconds = 0;
                statusText.textContent = 'Выберите клетку';
                render();
            } catch (error) {
                statusText.textContent = 'Не удалось создать игру: ' + error.message;
            } finally {
                busy = false;
                newGameButton.disabled = false;
            }
        }

        async function move(action, row, column) {
            if (!game || game.isFinished || busy) return;
            busy = true;
            try {
                const before = game.isFinished;
                game = await request('/api/games/' + game.id + '/' + action, 'POST', { row, column });
                if (game.isFinished && !before) {
                    statusText.textContent = game.isWon ? 'Победа! Результат сохранён в базу.' : 'Поражение. Результат сохранён в базу.';
                    if (!game.resultSaved) statusText.textContent = 'Игра окончена, но результат не сохранён.';
                    await loadResults();
                }
                render();
            } catch (error) {
                statusText.textContent = 'Ошибка запроса: ' + error.message;
            } finally {
                busy = false;
            }
        }

        function render() {
            if (!game) return;
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${game.columns}, 36px)`;
            for (const cell of game.cells) {
                const element = document.createElement('div');
                element.className = 'cell';
                if (cell.isOpened || (game.isFinished && !game.isWon && cell.isMine)) {
                    element.classList.add('revealed');
                    if (cell.isMine) {
                        element.classList.add('mine');
                        element.textContent = '💣';
                    } else if (cell.minesAround > 0) {
                        element.textContent = cell.minesAround;
                    }
                } else if (cell.isFlagged) {
                    element.classList.add('flagged');
                    element.textContent = '🚩';
                }
                element.addEventListener('click', () => move('reveal', cell.row, cell.column));
                element.addEventListener('contextmenu', event => {
                    event.preventDefault();
                    move('flag', cell.row, cell.column);
                });
                board.appendChild(element);
            }
            shownSeconds = game.seconds;
            mineCounter.textContent = 'Мины: ' + game.mines;
            flagCounter.textContent = 'Флаги: ' + game.flags;
            moveCounter.textContent = 'Ходы: ' + game.moves;
            updateTimer();
        }

        function updateTimer() {
            timerText.textContent = 'Время: ' + shownSeconds + ' сек.';
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;').replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        async function loadResults() {
            try {
                const results = await request('/api/results');
                if (results.length === 0) {
                    resultsBody.innerHTML = '<tr><td colspan="7">Пока результатов нет</td></tr>';
                    return;
                }
                resultsBody.innerHTML = results.map(result => `
                    <tr>
                        <td>${escapeHtml(result.playerName)}</td>
                        <td>${result.isWin ? 'Победа' : 'Поражение'}</td>
                        <td>${escapeHtml(result.difficulty)}</td>
                        <td>${escapeHtml(result.firstMoveMode)}</td>
                        <td>${result.seconds} сек.</td>
                        <td>${result.moves}</td>
                        <td>${escapeHtml(result.createdAt)}</td>
                    </tr>
                `).join('');
            } catch {
                resultsBody.innerHTML = '<tr><td colspan="7">Не удалось загрузить результаты</td></tr>';
            }
        }

        newGameButton.addEventListener('click', newGame);
        difficultySelect.addEventListener('change', newGame);
        firstMoveSelect.addEventListener('change', newGame);
        tick = setInterval(() => {
            if (game && game.moves > 0 && !game.isFinished) {
                shownSeconds++;
                updateTimer();
            }
        }, 1000);
        newGame();
        loadResults();
    </script>
</body>
</html>
